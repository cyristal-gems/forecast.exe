[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "forecast-exe"
version = "1.0.0"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["streamlit>=1.67,<2", "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "plotly>=5.24", "httpx>=0.27", "pyarrow>=17", "joblib>=1.4", "reverse_geocoder>=1.5.1", "tzfpy>=2.1", "pycountry>=24.6"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
[tool.setuptools.packages.find]
include = ["forecast_exe*"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
forecast_exe = ["style.css", "location_bridge.js"]
